<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Data Table</title>
  <style>
    table {
      border-collapse: collapse;
      width: 80%;
      margin: 20px auto;
    }
    th, td {
      border: 1px solid #444;
      padding: 8px 12px;
      text-align: center;
    }
    th {
      background-color: #eee;
    }
  </style>
</head>
<body>
  <h2 style="text-align:center;">School Student Data</h2>
   <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
        <th>Marks</th>
        <th>Address</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>101</td>
        <td>Rahul Sharma</td>

        <td>87</td>
        <td>Bhubaneswar, Odisha</td>
      </tr>
      <tr>
        <td>102</td>
        <td>Priya Das</td>
        <td>15</td>
        <td>92</td>
        <td>Cuttack, Odisha</td>
      </tr>
      <tr>
        <td>103</td>
        <td>Arjun Verma</td>
        <td>13</td>
        <td>78</td>
        <td>Bhubaneswar</td>
      </tr>
      <tr>
        <td>104</td>
        <td>Sneha Gupta</td>
        <td>14</td>
        <td>95</td>
        <td>Bhubaneswar</td>
      </tr>
    </tbody>
  </table>
</body>
</html>

<!--thead _ table head, tr _ table row, th _ table heading, td _ table data -->
